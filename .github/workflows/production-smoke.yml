name: Cleaning by Cassi Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the requested production revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 https://cleaningbycassi.com/api/release > /tmp/release.json &&
              node -e 'const r=JSON.parse(require("node:fs").readFileSync("/tmp/release.json","utf8"));process.exit(r.revision===process.env.EXPECTED_SHA?0:1)'; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check production pages
        shell: bash
        run: |
          set -euo pipefail

          check_html() {
            local url="$1"
            local marker="$2"
            local body_file
            local headers_file
            body_file="$(mktemp)"
            headers_file="$(mktemp)"

            if ! curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --dump-header "$headers_file" --output "$body_file" "$url"; then
              echo "Request failed for $url"
              cat "$headers_file" 2>/dev/null || true
              head -c 2000 "$body_file" 2>/dev/null || true
              rm -f "$body_file" "$headers_file"
              exit 1
            fi

            grep -qi '^content-type:.*text/html' "$headers_file"
            grep -q "$marker" "$body_file"
            ! grep -q '\[object Object\]' "$body_file"
            echo "PASS: $url"
            rm -f "$body_file" "$headers_file"
          }

          check_html "https://cleaningbycassi.com/" "Cleaning by Cassi"
          check_html "https://www.cleaningbycassi.com/" "Cleaning by Cassi"
          check_html "https://cleaningbycassi.com/quote" "0x4AAAAAAEmmOovf3yTuy_Ua"
          check_html "https://cleaningbycassi.com/quote-success" "Quote Request Received"
          check_html "https://cleaningbycassi.com/about" "Cassi"
          check_html "https://cleaningbycassi.com/services" "Cleaning"
          check_html "https://cleaningbycassi.com/pricing" "Pricing"
          check_html "https://cleaningbycassi.com/review" "feedback"
          check_html "https://cleaningbycassi.com/privacy" "information"

      - name: Check runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$status_file" "$headers_file"' EXIT

          # Push workflows can start before the independently managed Worker
          # deployment finishes. Retry the contract, not just HTTP failures.
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 5 --max-time 10 \
              --dump-header "$headers_file" \
              --output "$status_file" https://cleaningbycassi.com/api/status &&
              grep -qi '^cross-origin-resource-policy: *same-origin' "$headers_file" &&
              grep -qi '^referrer-policy: *no-referrer' "$headers_file" &&
              node -e 'const v=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); process.exit(v.ok===true && v.checks?.protection && v.checks?.delivery && !("runtime" in v) ? 0 : 1)' "$status_file"; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true

          grep -qi '^content-type:.*application/json' "$headers_file"
          grep -qi '^cache-control:.*no-store' "$headers_file"
          grep -qi '^x-content-type-options: *nosniff' "$headers_file"
          grep -qi '^cross-origin-resource-policy: *same-origin' "$headers_file"
          grep -qi '^referrer-policy: *no-referrer' "$headers_file"

          node - "$status_file" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const required = ['worker', 'quote', 'protection', 'delivery'];
          const forbidden = ['turnstile', 'resend', 'generatedAt', 'requestId', 'runtime'];
          const valid = value.ok === true && value.scope === 'configuration-readiness' && value.status === 'operational' &&
            required.every((key) => value.checks?.[key]?.status === 'operational') &&
            forbidden.every((key) => !(key in value) && !(key in (value.checks ?? {})));
          if (!valid) {
            console.error(JSON.stringify(value, null, 2));
            throw new Error('Production runtime is degraded');
          }
          console.log(value.summary);
          NODE

          method_status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null \
            --write-out '%{http_code}' --request POST \
            --header 'Origin: https://cleaningbycassi.com' \
            --header 'Content-Type: application/json' \
            https://cleaningbycassi.com/api/status)"
          test "$method_status" = 405

      - name: Check rejected quote contract
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output "$body_file" \
            --write-out '%{http_code}' --request POST \
            --header 'Accept: application/json' \
            --header 'Origin: https://cleaningbycassi.com' \
            --form 'name=Production Smoke Test' \
            --form 'email=smoke@example.com' \
            --form 'phone=5555555555' \
            --form 'cf-turnstile-response=invalid-smoke-token' \
            https://cleaningbycassi.com/api/quote)"

          test "$status" = 403
          node - "$body_file" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (value.code !== 'turnstile-failed' || typeof value.requestId !== 'string') {
            throw new Error('Unexpected quote rejection response');
          }
          NODE
