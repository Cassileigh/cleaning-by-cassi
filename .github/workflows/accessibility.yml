name: Accessibility & Theme Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Light, dark, and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/cleaning-by-cassi-accessibility.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cleaning-by-cassi-accessibility.log
          exit 1

      - name: Install browser accessibility tooling
        run: |
          npx playwright install --with-deps chromium webkit

      - name: Test light and dark themes with axe
        run: |
          npx playwright test tests/accessibility.spec.cjs tests/theme-assets.spec.cjs tests/quote-interactions.spec.cjs tests/navigation.spec.cjs --reporter=line

      - name: Test Safari navigation and quote recovery
        run: npx playwright test tests/quote-interactions.spec.cjs tests/navigation.spec.cjs --browser=webkit --reporter=line

      - name: Upload theme screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Run Lighthouse accessibility audit
        run: node scripts/lighthouse.mjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-diagnostics
          path: |
            /tmp/cleaning-by-cassi-accessibility.log
            .lighthouseci
            test-results
          if-no-files-found: ignore
          include-hidden-files: true
