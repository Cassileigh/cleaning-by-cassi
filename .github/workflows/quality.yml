name: Cleaning by Cassi Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, type check, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: API contract tests (no email sends)
        run: node --test tests/api-contract.test.mjs
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Cloudflare deploy dry run
        run: npx wrangler deploy --dry-run
      - name: Dependency audit
        run: npm run audit
