name: Browser navigation diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - run: npx wrangler dev --port 4321 --host 127.0.0.1 --upstream-protocol http > /tmp/preview.log 2>&1 &
      - run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/preview.log
          exit 1
      - run: node scripts/webkit-diagnostics.cjs
