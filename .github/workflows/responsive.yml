name: Responsive Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    name: Responsive viewport matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/cleaning-by-cassi-preview.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cleaning-by-cassi-preview.log
          exit 1

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive compatibility matrix
        run: |
          cat > tests-responsive.spec.cjs <<'TEST'
          const { test, expect } = require('@playwright/test');

          const baseURL = 'http://127.0.0.1:4321';
          const routes = ['/', '/services/', '/pricing/', '/about/', '/quote/', '/quote-success/'];
          const viewports = [
            [320, 568], [360, 800], [375, 667], [390, 844], [430, 932],
            [540, 720], [768, 1024], [820, 1180], [1024, 768],
            [1280, 800], [1440, 900], [1920, 1080]
          ];

          test.describe.configure({ mode: 'serial' });

          for (const [width, height] of viewports) {
            for (const route of routes) {
              test(`${route} @ ${width}x${height}`, async ({ page }) => {
                const errors = [];
                page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
                page.on('console', message => {
                  if (message.type() === 'error') errors.push(`console: ${message.text()}`);
                });

                await page.setViewportSize({ width, height });
                await page.goto(`${baseURL}${route}`, { waitUntil: 'networkidle' });
                await page.waitForTimeout(150);

                const result = await page.evaluate(() => {
                  const offenders = [];
                  for (const element of document.querySelectorAll('*')) {
                    const rect = element.getBoundingClientRect();
                    if (rect.width > 0 && (rect.right > innerWidth + 1 || rect.left < -1)) {
                      offenders.push({
                        tag: element.tagName,
                        id: element.id,
                        className: String(element.className).slice(0, 120),
                        left: Math.round(rect.left),
                        right: Math.round(rect.right),
                        width: Math.round(rect.width)
                      });
                    }
                  }

                  return {
                    viewportWidth: innerWidth,
                    documentWidth: Math.max(
                      document.documentElement.scrollWidth,
                      document.body.scrollWidth
                    ),
                    offenders: offenders.slice(0, 12)
                  };
                });

                expect(
                  result.documentWidth,
                  `Horizontal overflow: ${JSON.stringify(result.offenders)}`
                ).toBeLessThanOrEqual(result.viewportWidth + 1);
                expect(errors, `Runtime errors at ${width}x${height}`).toEqual([]);
              });
            }
          }
          TEST

          npx playwright test tests-responsive.spec.cjs --reporter=line

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-preview-log
          path: /tmp/cleaning-by-cassi-preview.log
          if-no-files-found: ignore
