name: Cleaning by Cassi Production Integrity

on:
  workflow_run:
    workflows: ['Cleaning by Cassi Production Smoke']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-integrity
  cancel-in-progress: true

jobs:
  integrity:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify production security and revision stability (no email sends)
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/verify-integrity.mjs
